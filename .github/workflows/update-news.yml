name: Update News Daily

on:
  schedule:
    # 每天 UTC 00:00 运行 (北京时间 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 手动触发
  push:  # 推送时也触发（用于测试和修复）
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Update news data
        run: node scripts/update-news.js
        
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/*.json
          # 先提交再 rebase，否则脏工作区会让 git pull --rebase 直接报错退出 128
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update news data"
          git pull --rebase origin main
          git push

  deploy-to-cloudbase:
    runs-on: ubuntu-latest
    needs: update-news
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli
        
      - name: Deploy to CloudBase
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENT_SECRET_KEY }}
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
        run: tcb hosting deploy ./dist -e $CLOUDBASE_ENV_ID